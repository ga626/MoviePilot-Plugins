name: Plugin Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-release-gate:
    name: Plugin release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Check federation plugin CSS
        run: python .github/scripts/check_federation_css.py

      - name: Check new plugin tests
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          python scripts/check_new_plugin_tests.py --base-ref origin/main

  plugin-test-gate:
    name: Plugin test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          path: MoviePilot-Plugins-Official

      - name: Checkout MoviePilot V3 backend
        uses: actions/checkout@v7
        with:
          repository: jxxghp/MoviePilot
          ref: v3
          path: MoviePilot

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: MoviePilot/pyproject.toml
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            MoviePilot/pyproject.toml
            MoviePilot/uv.lock

      - name: Install backend test environment
        working-directory: MoviePilot
        run: uv sync --locked

      - name: Run V3 plugin tests
        env:
          MOVIEPILOT_BACKEND_PATH: ${{ github.workspace }}/MoviePilot
        working-directory: MoviePilot-Plugins-Official
        run: ../MoviePilot/.venv/bin/python tests/run.py

  mediagovernor-golden-gate:
    name: MediaGovernor golden gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: plugins.v3/mediagovernor
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Run golden contract and build
        working-directory: plugins.v3/mediagovernor
        run: |
          pnpm test:contracts
          pnpm test:golden
          pnpm build

      - name: Build MediaGovernorValidator federation bundle
        working-directory: plugins.v3/mediagovernorvalidator
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          git diff --exit-code -- dist

  plugin-dependency-scope:
    name: V3 dependency scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.dependency-scope.outputs.run }}
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 工作流和测试改动由合同测试验证；仅依赖声明或安装器变化需要真实安装。
      - name: Determine whether dependency gate is required
        id: dependency-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --no-renames "$BASE_SHA" HEAD -- \
            'plugins.v3/*/pyproject.toml' \
            'scripts/check_v3_dependency_install.py')"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dependency declarations or installer changed; checking all supported platforms."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged; platform installation jobs are not required."
          fi

  plugin-dependency-install-gate:
    name: V3 dependency install (${{ matrix.name }})
    needs: plugin-dependency-scope
    if: needs.plugin-dependency-scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - name: Windows x64
            os: windows-latest
            platform: windows-x64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos-x64
          - name: macOS arm64
            os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: plugins.v3/*/pyproject.toml

      - name: Install V3 plugin dependencies
        env:
          PYTHONUTF8: '1'
        run: uv run --no-project --python 3.14 python scripts/check_v3_dependency_install.py --python 3.14 --platform "${{ matrix.platform }}"

  plugin-dependency-gate:
    name: V3 dependency gate
    needs: [plugin-dependency-scope, plugin-dependency-install-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required installation results
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.plugin-dependency-scope.result }}
          INSTALL_REQUIRED: ${{ needs.plugin-dependency-scope.outputs.run }}
          INSTALL_RESULT: ${{ needs.plugin-dependency-install-gate.result }}
        run: |
          set -euo pipefail
          [ "$SCOPE_RESULT" = success ]
          if [ "$INSTALL_REQUIRED" = false ] && [ "$INSTALL_RESULT" = skipped ]; then
            echo "Dependencies unchanged; platform installations were not run."
          elif [ "$INSTALL_REQUIRED" = true ] && [ "$INSTALL_RESULT" = success ]; then
            echo "All required platform installations passed."
          else
            echo "Dependency gate incomplete or failed." >&2
            exit 1
          fi
